<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z・I 欠損低減算出ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../js/zi.js?v=2" defer></script>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; color: #333; }
        h1 { border-bottom: 2px solid #ddd; padding-bottom: 5px; font-size: 24px;}
        .control-panel { background: #f9f9f9; padding: 20px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ccc; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 5px; flex: 1; min-width: 250px; }
        label { font-weight: bold; margin-right: 10px; display: inline-block; margin-bottom: 5px;}
        select, input[type="number"] { padding: 4px 8px; font-size: 15px; margin-bottom: 5px; }
        .btn-group { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;}
        button { color: white; border: none; border-radius: 3px; cursor: pointer; padding: 10px 20px; font-weight: bold; font-size: 15px;}
        .btn-calc { background-color: #007bff; }
        .btn-clear { background-color: #6c757d; }
        .btn-pdf { background-color: #28a745; }
        .btn-save { background-color: #fd7e14; }
        .btn-load { background-color: #17a2b8; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 14px; }
        th, td { border: 1px solid #aaa; padding: 10px; text-align: center; vertical-align: middle; }
        th { background-color: #eee; }
        .highlight { color: #d9534f; font-weight: bold; font-size: 16px; }
        .highlight-blue { color: #0275d8; font-weight: bold; font-size: 14px; }
        .mode-selector { margin-bottom: 20px; padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 16px; font-weight: bold; }
        .legend { font-size: 13px; color: #dc3545; font-weight: bold; margin-bottom: 10px; }
        #pdf-export-area { padding: 10px; background: #fff; }
        .pdf-title { text-align: center; margin-bottom: 20px; display: none; font-size: 20px;}
        .img-container { text-align: center; display: flex; justify-content: center; align-items: center; }
        .btn-back:hover { background: #2d3748 !important; }
        
        /* 削除ボタンのスタイル */
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-delete:hover { background-color: #c82333; }

        /* 印刷時に隠す要素 */
        @media print {
            .no-print { display: none !important; }
        }
    </style>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="tool-container">
    <div id="global-header-container"></div>
    <h1>Z・I 欠損低減算出ツール（アーキトレンド入力補助）</h1>
    <div class="control-panel">
        <div class="mode-selector">
            <label><input type="radio" name="calcMode" value="precut" checked onchange="toggleMode()"> ① プレカット仕口</label>
            <label style="margin-left: 20px;"><input type="radio" name="calcMode" value="watari" onchange="toggleMode()"> ② 渡り顎</label>
        </div>
        <div class="form-row">
            <div class="form-group" style="background: #e9f5ff; border-color: #b8daff;">
                <label>【主材】 受ける梁 (計算対象):</label><br>
                幅 (b): <select id="mainB"><option value="105">105</option><option value="120">120</option><option value="135">135</option><option value="150">150</option></select>
                成 (d): <select id="mainD"><option value="105">105</option><option value="120">120</option><option value="135">135</option><option value="150">150</option><option value="180">180</option><option value="210">210</option><option value="240">240</option><option value="270">270</option><option value="300" selected>300</option><option value="330">330</option><option value="360">360</option><option value="390">390</option></select>
            </div>
        </div>
        <div id="area-precut">
            <div class="form-row">
                <div class="form-group">
                    <label>【左側】 梁成:</label> <select id="leftD"><option value="0">なし</option><option value="105">105</option><option value="120">120</option><option value="135">135</option><option value="150" selected>150</option><option value="180">180</option><option value="210">210</option><option value="240">240</option><option value="270">270</option><option value="300">300</option></select>
                    仕口: <select id="leftJoint"><option value="ari">B: 大入れ蟻掛け</option><option value="ooire">A: 甲乙梁の大入れ</option></select>
                </div>
                <div class="form-group">
                    <label>【右側】 梁成:</label> <select id="rightD"><option value="0">なし</option><option value="105" selected>105</option><option value="120">120</option><option value="135">135</option><option value="150">150</option><option value="180">180</option><option value="210">210</option><option value="240">240</option><option value="270">270</option><option value="300">300</option></select>
                    仕口: <select id="rightJoint"><option value="ari">B: 大入れ蟻掛け</option><option value="ooire">A: 甲乙梁の大入れ</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label><input type="checkbox" id="chkHozo" checked> C: 中央に短ほぞを受ける (幅30mm×深さ30mm)</label></div>
            </div>
        </div>
        <div id="area-watari" style="display:none;">
            <div class="form-row">
                <div class="form-group" style="background:#fff3cd;">上面全体を <input type="number" id="watariDepth" value="30" style="width:60px;"> mm 欠き込む</div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-calc" onclick="calculateAndAddRow()">計算して追加</button>
            <button class="btn-clear" onclick="clearTable()">履歴クリア</button>
            <button class="btn-pdf" onclick="exportToPDF()">PDF出力</button>
            <button class="btn-save" onclick="saveToFile()">ファイルを保存</button>
            <button class="btn-load" onclick="document.getElementById('fileInput').click()">復元</button>
            <input type="file" id="fileInput" style="display:none;" onchange="loadFromFile(event)">
        </div>
    </div>
    <div id="pdf-export-area">
        <h2 class="pdf-title" id="pdfTitle">Z・I 欠損低減 検討表</h2>
        <h2 id="screenTitle">計算結果</h2>
        <table id="resultTable">
            <thead><tr><th width="15%">断面図</th><th>主材</th><th>条件</th><th>Z0</th><th>Ze</th><th>Z低減%</th><th>I係数</th><th class="no-print">操作</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="../js/common.js"></script>
</div>
</body>
</html>
